{
    "device.node_id": "canary-svc-01",
    "ip.ignorelist": [],
    "logtype.ignorelist": [],
    "logger": {
        "class": "PyLogger",
        "kwargs": {
            "formatters": { "plain": { "format": "%(message)s" } },
            "handlers": {
                "console": { "class": "logging.StreamHandler", "stream": "ext://sys.stdout" },
                "file": { "class": "logging.FileHandler", "filename": "/var/log/opencanary/opencanary.log" }
            }
        }
    },
    "ftp.enabled": true,
    "ftp.port": 21,
    "ftp.banner": "FTP server ready",
    "ftp.log_auth_attempt_initiated": false,
    "mysql.enabled": true,
    "mysql.port": 3306,
    "mysql.banner": "5.7.42-0ubuntu0.18.04.1",
    "mysql.log_connection_made": true,
    "redis.enabled": true,
    "redis.port": 6379,
    "mssql.enabled": true,
    "mssql.version": "2012",
    "mssql.port": 1433,
    "vnc.enabled": true,
    "vnc.port": 5000,
    "git.enabled": true,
    "git.port": 9418,
    "git.max_connections": 32,
    "git.timeout": 10,
    "http.enabled": false,
    "https.enabled": false,
    "httpproxy.enabled": false,
    "ssh.enabled": false,
    "telnet.enabled": false,
    "smb.enabled": false,
    "rdp.enabled": false,
    "sip.enabled": false,
    "snmp.enabled": false,
    "ntp.enabled": false,
    "tftp.enabled": false,
    "llmnr.enabled": false,
    "portscan.enabled": false,
    "tcpbanner.enabled": false
}
