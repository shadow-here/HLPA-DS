# HLPA-DS Cowrie overlay config (layered on top of Cowrie's bundled defaults).
# Medium-interaction EMULATED shell only. No proxy backend, no real OS.
[honeypot]
hostname = srv-backup-02
log_path = var/log/cowrie
state_path = var/lib/cowrie
etc_path = etc
# Credential DB is synthetic (see userdb.txt)
auth_class = UserDB


# Attacker downloads cannot succeed: decoy egress is blocked by the internal network.
ttylog = false
authentication_timeout = 60

[ssh]
enabled = true
version = SSH-2.0-OpenSSH_8.2p1 Ubuntu-4ubuntu0.5
listen_endpoints = tcp:22:interface=0.0.0.0
sftp_enabled = false
forwarding = false
forward_redirect = false
forward_tunnel = false

[telnet]
enabled = true
listen_endpoints = tcp:23:interface=0.0.0.0

[output_jsonlog]
enabled = true
logfile = ${honeypot:log_path}/cowrie.json
epoch_timestamp = false

[output_textlog]
enabled = false
